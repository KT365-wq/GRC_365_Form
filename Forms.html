<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Forms</title>
	<style>
		@font-face{
			font-family: Spectral;
				src: url("Spectral-Regular.ttf");
		}@font-face{
			font-family: NotoSerif;
				src: url("NotoSerif_Condensed-Regular.ttf");
		} body{
			background: #1c2037;
		} h1 {
			text-align: center;
			font: 25pt/1em NotoSerif;
		} form {
			width: 600px;
			min-height: 600px;
			padding: 24px;
			background: #f8e6e4;
			margin: 23px auto;
			border: 1px solid #f8eae2;
			box-shadow: 2px 3px 6px #14182b;
			border-radius: 18px;
			
		} fieldset{
			margin-top: 18px;
		} #personal input, #submit{
			width: 100%;
			height: 24px;
			margin-bottom: 12px;
		} input[type="text"]{
			width: 98%;
			font: 11pt/1.4em Spectral;
		} select{
			width: 50%;
			padding: 2px 4px;
		} textarea{
			width: 98%;
			font: 11pt/1.4em NotoSerif;
		}input[type="submit"]{
			width: 75px;
			font: 12pt/1em Spectral;
		} legend{
			font: 13pt/1em NotoSerif;
		} label, option, select{
			font: 12pt/1.4em Spectral;
		}
	</style>
</head>

<body>
	<form action="#" method="post">
	<h1> Want to know more?</h1>
		
		<label>First Name</label><br/>
		<input type="text" /> <br/>
		<label> Last Name</label> <br/>
		<input type="text" /> <br/>
		<label> Email</label> <br/>
		<input type="text" /> <br/><br/>
		
	<fieldset>
		<legend>Where do you look at our site?</legend>
		<input type="radio" name="os" /> <label>MAC/IOS</label><br/>
		<input type="radio" name="os" /> <label> Iphone/phone</label><br/>
		<input type="radio" name="os" /> <label>Laptop</label><br/>
		<input type="radio" name="os" /> <label>Tablet</label>
	</fieldset>
		<br/>
		
	<fieldset>
		<legend> When are you primarily on your device?</legend>
		<input type="checkbox"/><label>Early in the morning</label> <br/>
		<input type="checkbox"/><label>The morning</label> <br/>
		<input type="checkbox"/><label>The afternoon</label> <br/>
		<input type="checkbox"/><label>The evening</label> <br/>
		<input type="checkbox"/><label>Throughout the day</label> <br/>
		<input type="checkbox"/><label>Late at night</label> <br/>
	</fieldset>
		<br/>
		
		<legend>What would you like to be updated on?</legend>	
		<select>
			<option></option>
			<option>Work in progresses</option>
			<option>Website updates</option>
			<option>Art post</option>
			<option>Progress videos</option>
			<option>Other</option>
		</select>
		<br/> <br/>
		
			<legend>Preferred choice of updates? (Choose 1)</legend>	
		<select>
			<option></option>
			<option>Email</option>
			<option>SMS text messages</option>
			<option>Social media post</option>
			<option>None</option>
		</select>
		<br/> <br/>
		
		<label>Other Comments</label> <br/>
			<textarea>
			</textarea>
		<br/><br/>
		<input type="submit" value="Submit" />
	</form>
</body>
</html>
